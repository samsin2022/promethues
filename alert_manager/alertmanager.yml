global:
  smtp_from: "sin.som2019@gmail.com"
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_auth_username: "sin.som2019@gmail.com"
  smtp_auth_identity: "sin.som2019@gmail.com"
  # FIXED: Removed the extra 'a' from smtp
  smtp_auth_password: "16-digit password"

route:
  # Added grouping to prevent notification flooding
  group_by: [ 'alertname', 'app_type', 'severity' ]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  # Default Receiver
  receiver: admin

  routes:
  # --- OS ALERTS (Linux/Windows) ---
  - match_re:
      app_type: (linux|windows)
    receiver: abc_sol-admin
    group_by: [ "category" ]
    routes:
    - match:
        app_type: linux
      receiver: abc_sol_linux-admin
      routes:
      - match:
          severity: critical # FIXED: serverity -> severity
        receiver: abc_sol_linux-manager
      - match:
          severity: warning # FIXED: serverity -> severity
        receiver: abc_sol_linux-teamlead

    - match:
        app_type: windows
      receiver: abc_sol_windows-admin
      routes:
      - match:
          severity: critical
        receiver: abc_sol_windows-manager
      - match:
          severity: warning
        receiver: abc_sol_windows-teamlead

  # --- APPLICATION ALERTS (Python/Go) ---
  - match_re:
      app_type: (python|go)
    receiver: xyz_sol-admin
    routes:
    - match:
        app_type: python
      receiver: xyz_sol_python-admin
      routes:
      - match:
          severity: critical
        receiver: xyz_sol_python-manager
      - match:
          severity: warning
        receiver: xyz_sol_python-teamlead
    - match:
        app_type: go
      receiver: xyz_sol_go-admin
      routes:
      - match:
          severity: critical
        receiver: xyz_sol_go-manager
      - match:
          severity: warning
        receiver: xyz_sol_go-teamlead

